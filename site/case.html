<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier6K case — exploded view</title>
<style>
  :root { --bg: #0e1411; --panel: #151d19; --line: #26332c; --text: #e6ece8; --muted: #9aa8a0; --accent: #e8c547; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body.light { --bg: #ffffff; --panel: #f3f5f4; --line: #d5dbd8; --text: #17211c; --muted: #55635c; --accent: #8a6d00; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .label { position: absolute; transform: translateY(-50%); white-space: nowrap; padding-left: 46px;
    opacity: 0; transition: opacity .2s; }
  .label::before { content: ""; position: absolute; left: 0; top: 50%; width: 38px; border-top: 1px solid var(--muted); }
  .label b { display: block; font-weight: 600; }
  .label span { color: var(--muted); font-size: 12px; }
  .label.on { opacity: 1; }
  #ui { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 14px; align-items: center;
    flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(8px); }
  #ui label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  #explode { width: min(46vw, 320px); accent-color: var(--accent); }
  #ui input[type=checkbox] { accent-color: var(--accent); }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); }
  body.bare #ui { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="status">Loading model…</div>
<div id="ui">
  <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label><input id="caps" type="checkbox" checked> Switches &amp; keycaps</label>
  <label><input id="tags" type="checkbox" checked> Labels</label>
</div>
<script type="module" src="case.js"></script>
</body>
</html>
